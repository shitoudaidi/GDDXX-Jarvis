name: ci
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:      # Actions > ci > Run workflow: build and publish the installers for the version in VERSION

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Linux audio library
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q jarvis app tests
      - name: brain and onboarding (fake model server)
        run: python tests/test_brain.py
      - name: every module imports
        run: python -c "import jarvis.service, jarvis.gesture, jarvis.onboard, jarvis.tools as t; print(sorted(t.names()))"

  voice:
    # the 23 voice scenarios (synthetic speech in tests/clips_en) need the speech models: cached between runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - uses: actions/cache@v4
        with:
          path: models
          key: models-${{ hashFiles('app/models.json') }}
      - run: sudo apt-get update && sudo apt-get install -y libportaudio2
      - run: python -m pip install -r requirements.txt
      - run: python app/install.py --no-page --models-only
        env: {JARVIS_APP_DIR: "${{ github.workspace }}"}
      - run: python tests/simulate_en.py
        env: {JARVIS_VOICE_MODELS: "${{ github.workspace }}/models"}
      - run: python tests/test_listen_pause.py
        env: {JARVIS_VOICE_MODELS: "${{ github.workspace }}/models", JARVIS_STAY_ON: "1"}
      - run: python tests/test_holo_library.py

  hud:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm i playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: (cd hud && python3 -m http.server 8811 &) && sleep 2 && node tests/hud_check.js http://127.0.0.1:8811/index.html

  build:
    # installers: built on every PR (to keep the scripts working) and on v* tags (published by the release job)
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name != 'push'
    needs: [test, hud]
    strategy:
      matrix:
        include:
          - {os: macos-14, script: "bash platform/mac/build.sh arm64", out: "dist/*.dmg"}
          - {os: macos-15-intel, script: "bash platform/mac/build.sh x86_64", out: "dist/*.dmg"}
          - {os: windows-latest, script: "choco install innosetup -y --no-progress; powershell -ExecutionPolicy Bypass -File platform/win/build.ps1", out: "dist/*.exe"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: ${{ matrix.script }}
        shell: bash
      - uses: actions/upload-artifact@v4
        with: {name: "jarvis-${{ matrix.os }}", path: "${{ matrix.out }}", if-no-files-found: error}

  install:
    # install the built installer the way a user would, download the real models, run the voice scenarios with the
    # installed Python, then open the app and check the voice service comes up with no errors
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: "jarvis-${{ matrix.os }}", path: dist}
      - name: install from the .dmg and set up (first run)
        if: runner.os == 'macOS'
        run: |
          hdiutil attach dist/*.dmg -mountpoint /tmp/jv -nobrowse
          cp -R /tmp/jv/Jarvis.app /Applications/ && hdiutil detach /tmp/jv
          RES=/Applications/Jarvis.app/Contents/Resources
          "$RES/python/bin/python3" "$RES/app/install.py" --no-page
          echo "VPY=$HOME/Library/Application Support/Jarvis/venv/bin/python" >> "$GITHUB_ENV"
      - name: install from the .exe and set up (first run)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $exe = (Get-ChildItem dist\*.exe)[0].FullName
          Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=' -Wait
          $app = "$env:LOCALAPPDATA\Jarvis"
          if (-not (Test-Path "$app\python\pythonw.exe")) { throw "not installed to $app" }
          & "$app\python\python.exe" "$app\app\install.py" --no-page
          if ($LASTEXITCODE -ne 0) { throw "setup failed" }
          "VPY=$app\venv\Scripts\python.exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: voice scenarios with the installed Python and models
        shell: bash
        run: |
          "$VPY" -c "import webview, sherpa_onnx, livekit, piper, cv2; print('imports ok')"
          "$VPY" tests/simulate_en.py
      - name: open the app (macOS)
        if: runner.os == 'macOS'
        run: |
          open /Applications/Jarvis.app
          "$VPY" tests/check_running.py 240
      - name: open the app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $app = "$env:LOCALAPPDATA\Jarvis"
          Start-Process "$app\python\pythonw.exe" -ArgumentList "`"$app\app\launch.py`"" -WorkingDirectory $app
          & $env:VPY tests/check_running.py 240
          if ($LASTEXITCODE -ne 0) { throw "app check failed" }
      - name: setup log
        if: always()
        shell: bash
        run: cat "$HOME/Library/Application Support/Jarvis/install.log" "$LOCALAPPDATA/Jarvis/install.log" 2>/dev/null | tail -80 || true

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build, install]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {path: dist, merge-multiple: true}
      - name: publish the installers on the Releases page
        env: {GH_TOKEN: "${{ github.token }}"}
        run: |
          ls -l dist
          tag="v$(cat VERSION)"      # a manual run creates the tag on this commit
          gh release create "$tag" dist/*.dmg dist/*.exe --target "$GITHUB_SHA" --title "Jarvis ${tag#v}" --notes-file docs/release-notes.md --latest
